name: Build Windows installer

# Every push to main builds the installer and publishes it as the GitHub Release
# for the version in package.json (tag v<version> is created automatically).
# Bump "version" in package.json to ship an update; installed apps auto-update from it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build & publish release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: LUT-Generator-Setup
          path: dist/*.exe
